[project]
name = "nldate"
version = "0.1.0"
description = "Parse natural language date expressions into datetime.date objects"
readme = "README.md"
authors = [
    { name = "Carter Taffe", email = "cquincy928@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.mypy]
strict = true
